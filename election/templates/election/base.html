<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Delta Election Results{% endblock %}</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#1f2937;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#123b32;color:white;padding:18px 6%;}header h1{font-size:1.25rem;margin:0 0 12px}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-weight:600}.container{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border-radius:12px;padding:24px;margin-bottom:18px;box-shadow:0 3px 14px #10203012}h2{margin-top:0}label{display:block;font-weight:600;margin:14px 0 6px}select,input{padding:10px;border:1px solid #cbd5e1;border-radius:6px;max-width:100%;width:100%;background:white}button,.button{display:inline-block;margin-top:16px;background:#147d64;color:white;border:0;border-radius:6px;padding:11px 16px;text-decoration:none;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}th{background:#eef4f2}.notice{padding:12px;border-radius:6px;background:#eaf5ff;margin:10px 0}.error{background:#fee2e2}.success{background:#dcfce7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.muted{color:#64748b}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{text-align:center;color:#64748b;padding:20px}
  </style>
</head>
<body>
<header><h1>Delta State Election Results</h1><nav><a href="{% url 'home' %}">Home</a><a href="{% url 'polling_unit_results' %}">Polling Unit Results</a><a href="{% url 'lga_results' %}">LGA Totals</a><a href="{% url 'enter_results' %}">Enter Results</a></nav></header>
<main class="container">
  {% for message in messages %}<div class="notice {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main><footer>Bincom election-results assessment · Sample data supplied for Delta State</footer>
</body></html>
